services:
  # 1. Database
  db:
    image: postgres:15
    container_name: seknna-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - seknna-network
    # Added health check to ensure PG is ready for connections
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend
  backend:
    build:
      context: ./backend
      network: host
    container_name: seknna-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy # Wait for healthcheck to pass
    networks:
      - seknna-network

  # 3. Frontend
  frontend:
    build:
      context: ./frontend
      network: host
    container_name: seknna-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - seknna-network

  # 4. pgAdmin 4
  pgadmin:
    container_name: seknna-pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - seknna-network
    restart: unless-stopped

# Networks
networks:
  seknna-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450 # MTU preserved as requested

# Volumes
volumes:
  postgres_data:
